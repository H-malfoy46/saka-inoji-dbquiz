<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>坂道×イコノイジョイ クイズ＆DB</title>

<!-- ホーム画面に追加してアプリのように使うための設定 -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#26314f">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="坂道クイズ">
<style>
  :root{
    --navy:#232b3d;        /* 文字と主要面。青みを少し抜いた濃紺 */
    --navy-soft:#4a5468;
    --pink:#e7c3cb;        /* マーカー用。彩度を落とした桜色 */
    --pink-deep:#a8556a;   /* 差し色。くすませて落ち着かせる */
    --bg:#f5f4f2;          /* 紙に近い無彩色。桜色寄りをやめる */
    --card:#ffffff;
    --line:#e2e0db;
    --line-soft:#eeece8;
    --muted:#8b8a86;
    --ok:#2f7a55;
    --ok-bg:#eaf2ed;
    --ng:#b0453f;
    --ng-bg:#f7ebea;
    --radius:10px;         /* 角を浅くして丸みの強さを抑える */
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--navy);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Meiryo",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:680px; margin:0 auto;
    padding:0 16px calc(60px + env(safe-area-inset-bottom, 0px));
  }
  .hidden{display:none !important;}

  /* ---------- ヘッダー / ナビ ---------- */
  header{
    background:var(--navy);
    border-bottom:3px solid var(--pink-deep);
    color:#fff;
    /* ホーム画面から起動したとき、iPhoneの時計表示と重ならないように余白を足す */
    padding:calc(22px + env(safe-area-inset-top, 0px)) 16px 0;
    position:sticky; top:0; z-index:30;
  }
  header .inner{max-width:680px; margin:0 auto;}
  header h1{margin:0; font-size:18px; letter-spacing:.04em;}
  header p{margin:5px 0 0; font-size:12px; opacity:.78;}
  nav{display:flex; gap:4px; margin-top:14px;}
  nav button{
    flex:1; background:none; border:none; color:#fff; opacity:.62;
    font-family:inherit; font-size:12px; font-weight:700; cursor:pointer;
    padding:10px 2px 11px; border-bottom:2.5px solid transparent; transition:.15s;
    position:relative; white-space:nowrap; min-width:0;
  }
  @media(min-width:420px){ nav button{font-size:13px; padding:10px 4px 11px;} }
  nav button:hover{opacity:.85;}
  nav button[aria-current="true"]{opacity:1; border-bottom-color:var(--pink);}
  nav .dot{
    display:inline-block; min-width:16px; padding:0 4px; margin-left:4px;
    background:var(--pink-deep); color:#fff; border-radius:99px;
    font-size:10px; line-height:16px; vertical-align:1px;
  }

  main{padding-top:30px;}

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px; margin-bottom:16px;
  }
  .card h2{
    margin:0 0 12px; font-size:13px; letter-spacing:.08em; color:var(--muted); font-weight:700;
  }

  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    border:1.5px solid var(--line); background:#fff; color:var(--navy);
    border-radius:999px; padding:7px 14px; font-size:13.5px; cursor:pointer;
    font-family:inherit; transition:.15s; font-weight:600;
  }
  .chip:hover{border-color:var(--pink-deep);}
  .chip[aria-pressed="true"]{background:var(--navy); color:#fff; border-color:var(--navy);}
  .chip[data-color][aria-pressed="true"]{background:var(--c); border-color:var(--c); color:var(--cf);}
  .chip.sm{padding:5px 11px; font-size:12.5px;}
  .row-actions{display:flex; gap:8px; margin-top:10px;}
  .mini{
    background:none; border:none; color:var(--muted); font-size:12px; cursor:pointer;
    text-decoration:underline; padding:2px 0; font-family:inherit;
  }

  .btn{
    width:100%; border:none; border-radius:8px; padding:15px;
    background:var(--navy); color:#fff; font-size:16px; font-weight:700;
    cursor:pointer; font-family:inherit; letter-spacing:.05em; transition:.15s;
  }
  .btn:hover{background:var(--navy-soft);}
  .btn:disabled{opacity:.4; cursor:not-allowed;}
  .btn.sub{background:#fff; color:var(--navy); border:1.5px solid var(--line);}
  .btn.sub:hover{border-color:var(--navy);}
  .btn.sm{padding:11px; font-size:14px;}

  /* ---------- クイズ ---------- */
  .qhead{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .qcount{font-size:13px; color:var(--muted); font-weight:700;}
  .qscore{font-size:13px; color:var(--muted);}
  .bar{height:5px; background:var(--line); border-radius:99px; overflow:hidden; margin-bottom:18px;}
  .bar > i{display:block; height:100%; background:var(--pink-deep); transition:width .3s;}
  .badges{display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap;}
  .badge{
    font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px;
    background:var(--navy); color:#fff; letter-spacing:.04em;
  }
  .badge.tag{background:#f0ecee; color:var(--muted);}
  .qtext{font-size:18px; line-height:1.6; font-weight:700; margin:0 0 18px;}
  .qtext .em{
    padding-bottom:1px;
    border-bottom:2px solid var(--pink-deep);
  }
  .choices{display:flex; flex-direction:column; gap:9px;}
  .choice{
    text-align:left; border:1.5px solid var(--line); background:#fff; color:var(--navy);
    border-radius:8px; padding:14px 15px; font-size:15px; cursor:pointer;
    font-family:inherit; font-weight:600; line-height:1.45; transition:.12s;
    display:flex; gap:11px; align-items:flex-start;
  }
  .choice:hover:not(:disabled){border-color:var(--pink-deep); background:#fffafb;}
  .choice:disabled{cursor:default;}
  .choice .no{
    flex:none; width:22px; height:22px; border-radius:50%; background:#f0ecee;
    color:var(--muted); font-size:12px; display:flex; align-items:center;
    justify-content:center; font-weight:700; margin-top:1px;
  }
  .choice.correct{border-color:var(--ok); background:var(--ok-bg);}
  .choice.correct .no{background:var(--ok); color:#fff;}
  .choice.wrong{border-color:var(--ng); background:var(--ng-bg);}
  .choice.wrong .no{background:var(--ng); color:#fff;}
  .choice.dim{opacity:.5;}
  .feedback{margin-top:16px;}
  .verdict{font-size:15px; font-weight:800; margin-bottom:8px;}
  .verdict.ok{color:var(--ok);} .verdict.ng{color:var(--ng);}
  .explain{font-size:13px; line-height:1.7; color:var(--navy-soft); background:#f7f5f6; border-radius:7px; padding:12px 14px;}
  .explain b{color:var(--navy);}
  .report-link{
    display:block; margin:11px auto 0; background:none; border:none;
    color:var(--muted); font-size:12px; cursor:pointer; font-family:inherit;
    text-decoration:underline;
  }
  .report-link:hover{color:var(--ng);}
  .report-link.done{color:var(--ok); text-decoration:none;}

  .score-big{text-align:center; padding:6px 0 4px;}
  .score-big .n{font-size:44px; font-weight:800; line-height:1.1;}
  .score-big .n small{font-size:20px; color:var(--muted); font-weight:700;}
  .score-big .msg{font-size:14px; color:var(--muted); margin-top:6px;}
  .review{list-style:none; margin:14px 0 0; padding:0;}
  .review li{display:flex; gap:10px; padding:11px 0; border-top:1px solid var(--line); font-size:13px; line-height:1.55;}
  .review .mk{flex:none; font-weight:800;}
  .review .mk.ok{color:var(--ok);} .review .mk.ng{color:var(--ng);}
  .review .ans{color:var(--muted); font-size:12px; margin-top:2px;}

  /* ---------- 記録 ---------- */
  .bestline{font-size:13px; color:var(--muted); margin-top:9px;}
  .bestline.up{color:var(--ok); font-weight:800;}
  .recrow{
    display:flex; justify-content:space-between; gap:12px; align-items:baseline;
    padding:10px 0; border-top:1px solid var(--line); font-size:13px;
  }
  .recrow:first-child{border-top:none; padding-top:2px;}
  .recrow .k{color:var(--navy-soft); min-width:0;}
  .recrow .v{font-weight:700; white-space:nowrap; font-variant-numeric:tabular-nums;}
  .recbar{height:4px; background:var(--line); border-radius:99px; overflow:hidden; margin-top:6px;}
  .recbar > i{display:block; height:100%; background:var(--pink-deep);}
  .recitem{padding:10px 0; border-top:1px solid var(--line); font-size:13px;}
  .recitem:first-child{border-top:none; padding-top:2px;}
  .recitem .top{display:flex; justify-content:space-between; gap:12px; align-items:baseline;}
  .recitem .top .v{font-weight:700; white-space:nowrap; font-variant-numeric:tabular-nums;}

  /* ---------- DB ブラウザ ---------- */
  .toolbar{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px; margin-bottom:14px;
  }
  .search{
    width:100%; border:1.5px solid var(--line); border-radius:8px; padding:12px 13px;
    font-size:15px; font-family:inherit; color:var(--navy); background:#fff;
  }
  .search:focus{outline:none; border-color:var(--pink-deep);}
  .toolbar .sec{margin-top:12px;}
  .toolbar .sec > span{
    display:block; font-size:11px; color:var(--muted); font-weight:700;
    letter-spacing:.06em; margin-bottom:7px;
  }
  .count{font-size:12px; color:var(--muted); margin:0 2px 10px; font-weight:600;}

  .rows{display:flex; flex-direction:column; gap:8px;}
  .row{
    background:var(--card); border:1px solid var(--line); border-radius:8px;
    overflow:hidden; transition:.15s;
  }
  .row:hover{border-color:var(--pink);}
  .row > button{
    width:100%; display:flex; gap:11px; align-items:flex-start; text-align:left;
    background:none; border:none; font-family:inherit; cursor:pointer;
    padding:13px 14px 13px 0; color:inherit;
  }
  .row .gbar{flex:none; width:5px; align-self:stretch; border-radius:0 3px 3px 0;}
  .row .body{flex:1; min-width:0;}
  .row .t1{
    font-size:14.5px; font-weight:700; line-height:1.45;
    display:flex; gap:8px; align-items:baseline; flex-wrap:wrap;
  }
  .row .t2{font-size:12px; color:var(--muted); margin-top:3px; line-height:1.55;}
  .row .t3{font-size:12.5px; margin-top:5px; color:var(--navy-soft);}
  .row .chev{flex:none; color:var(--line); font-size:12px; align-self:center; padding-right:2px;}
  .row.open .chev{transform:rotate(90deg); color:var(--pink-deep);}
  .row .chev{transition:.2s;}

  .ttag{
    font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:999px;
    background:#f0ecee; color:var(--muted); letter-spacing:.03em; white-space:nowrap;
  }
  .ttag.hyoudai{background:#fbe4ea; color:#b4426b;}
  .ttag.unit{background:#e6eefb; color:#3f6bb0;}
  .ttag.solo{background:#fdf0dd; color:#a9702a;}
  .ttag.gen{background:#e9f5ec; color:#3f8757;}
  .ttag.grad{background:#f2f0f4; color:#7d7488;}

  .detail{
    padding:2px 14px 14px 19px; border-top:1px dashed var(--line-soft);
    margin-top:0; font-size:13px;
  }
  .detail dl{display:grid; grid-template-columns:78px 1fr; gap:7px 12px; margin:12px 0 0;}
  .detail dt{color:var(--muted); font-size:11.5px; font-weight:700; padding-top:1px;}
  .detail dd{margin:0; line-height:1.6; word-break:break-word;}
  .detail .src{font-size:11px; color:var(--muted); line-height:1.55;}
  .warn{color:#b4426b;}

  .swatches{display:inline-flex; gap:4px; vertical-align:-2px; margin-right:6px;}
  .sw{
    width:13px; height:13px; border-radius:50%; display:inline-block;
    border:1px solid rgba(0,0,0,.14);
  }
  .more{margin-top:12px;}

  .empty{text-align:center; color:var(--muted); font-size:13px; padding:32px 0;}
  .row.faded > button{opacity:.45;}
  .row.faded.open > button{opacity:.75;}

  /* ---------- 一覧 / ランキング の切替 ---------- */
  .modebar{display:flex; gap:6px; margin:0 0 14px;}
  .modebar button{
    flex:1; border:1.5px solid var(--line); background:#fff; color:var(--muted);
    border-radius:7px; padding:9px 4px; font-family:inherit; font-size:13.5px;
    font-weight:700; cursor:pointer; transition:.12s;
  }
  .modebar button[aria-pressed="true"]{
    background:var(--navy); border-color:var(--navy); color:#fff;
  }

  /* ---------- ランキング ---------- */
  .rk{display:flex; gap:11px; align-items:center; padding:12px 14px 12px 12px;}
  .rk .no{
    flex:none; width:26px; text-align:center; font-size:13px; font-weight:800;
    color:var(--muted); font-variant-numeric:tabular-nums;
  }
  .rk .no.top{color:var(--pink-deep);}
  .rk .body{flex:1; min-width:0;}
  .rk .nm{
    font-size:14.5px; font-weight:700; line-height:1.4;
    display:flex; gap:8px; align-items:baseline; flex-wrap:wrap;
  }
  .rk .sub{display:block; font-size:11.5px; color:var(--muted); margin-top:3px;}
  .rk .bar{
    display:block; height:5px; background:var(--line);
    border-radius:99px; overflow:hidden; margin-top:6px;
  }
  .rk .bar > i{display:block; height:100%; background:var(--pink-deep); border-radius:99px;}
  .rk .cnt{
    flex:none; font-size:14px; font-weight:800; white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  .rk .cnt small{font-size:11px; font-weight:700; color:var(--muted); margin-left:1px;}
  .rkitems{
    padding:2px 14px 14px 49px; border-top:1px dashed var(--line-soft);
    font-size:12.5px; line-height:1.75; color:var(--navy-soft);
  }
  .rkitems div{padding-top:7px;}
  .rkitems .cd{color:var(--muted); font-size:11.5px;}

  /* ---------- 制作者の担当曲 ---------- */
  .crsongs{padding:2px 14px 12px 19px; border-top:1px dashed var(--line-soft);}
  .crsong{
    display:flex; gap:10px; align-items:flex-start;
    padding:9px 0; border-top:1px solid var(--line-soft);
  }
  .crsong:first-child{border-top:none;}
  .crsong .rl{
    flex:none; width:74px; text-align:center; font-size:10.5px; font-weight:700;
    color:var(--navy-soft); background:var(--line-soft); border-radius:4px;
    padding:3px 4px; line-height:1.4;
  }
  .crsong .body{flex:1; min-width:0;}
  .crsong .ti{display:block; font-size:13.5px; font-weight:700; line-height:1.45;}
  .crsong .mt{display:block; font-size:11.5px; color:var(--muted); margin-top:2px;}

  /* ---------- モーダル ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(30,24,34,.5); z-index:60;
    display:flex; align-items:flex-end; justify-content:center; padding:16px;
  }
  @media(min-width:600px){ .overlay{align-items:center;} }
  .modal{
    background:#fff; border-radius:8px; padding:20px; width:100%; max-width:520px;
    max-height:86vh; overflow:auto;
  }
  .modal h3{margin:0 0 4px; font-size:16px;}
  .modal .sub{font-size:12px; color:var(--muted); margin:0 0 14px; line-height:1.6;}
  .modal .qbox{
    background:#f7f5f6; border-radius:7px; padding:11px 13px; font-size:12.5px;
    line-height:1.6; margin-bottom:14px; color:var(--navy-soft);
  }
  .modal label{display:block; font-size:11.5px; color:var(--muted); font-weight:700; margin:0 0 7px;}
  .modal textarea{
    width:100%; border:1.5px solid var(--line); border-radius:8px; padding:11px;
    font-size:14px; font-family:inherit; min-height:84px; resize:vertical; color:var(--navy);
  }
  .modal textarea:focus{outline:none; border-color:var(--pink-deep);}
  .modal .acts{display:flex; gap:8px; margin-top:16px;}

  .rep{
    background:var(--card); border:1px solid var(--line); border-radius:8px;
    padding:13px 14px; margin-bottom:8px; font-size:13px; line-height:1.6;
  }
  .rep .meta{font-size:11px; color:var(--muted); margin-bottom:5px;}
  .rep .kind{
    display:inline-block; font-size:10.5px; font-weight:700; padding:2px 8px;
    border-radius:999px; background:#fbe4ea; color:#b4426b; margin-right:6px;
  }
  .rep .cmt{margin-top:6px; color:var(--navy-soft);}
  .rep .q{font-weight:700;}

  .toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
    background:var(--navy); color:#fff; padding:11px 20px; border-radius:6px;
    font-size:13px; font-weight:700; z-index:80;
  }
  footer{text-align:center; font-size:11.5px; color:var(--muted); padding:14px 0 0; line-height:1.7;}
  footer .notice{
    border:1px solid var(--line); border-radius:7px; background:var(--card);
    padding:11px 13px; margin-bottom:10px; text-align:left; color:var(--navy-soft);
  }
  footer .notice b{color:var(--navy);}
</style>
</head>
<body>

<header>
  <div class="inner">
    <h1>坂道 × イコノイジョイ DB</h1>
    <p>坂道グループ(乃木坂46・櫻坂46(欅坂46)・日向坂46(けやき坂46))と指原グループ(=LOVE・≠ME・≒JOY)のデータベース</p>
    <nav>
      <button data-view="quiz"    aria-current="true">クイズ</button>
      <button data-view="songs">楽曲</button>
      <button data-view="members">メンバー</button>
      <button data-view="creators">作曲・編曲</button>
    </nav>
  </div>
</header>

<main class="wrap">

  <!-- ================= クイズ ================= -->
  <div id="view-quiz">
    <section id="setup">
      <div class="card">
        <h2>グループ</h2>
        <div class="chips" id="groupChips"></div>
        <div class="row-actions">
          <button class="mini" data-all="1">すべて選択</button>
          <button class="mini" data-all="0">すべて解除</button>
        </div>
      </div>
      <div class="card">
        <h2>ジャンル</h2>
        <div class="chips" id="catChips"></div>
      </div>
      <div class="card">
        <h2>難易度</h2>
        <div class="chips" id="levelChips"></div>
      </div>
      <div class="card">
        <h2>問題数</h2>
        <div class="chips" id="countChips"></div>
      </div>
      <button class="btn" id="startBtn">クイズをはじめる</button>
      <p id="setupNote" style="font-size:12px;color:var(--muted);text-align:center;margin:10px 0 0;"></p>
      <button class="btn sub" id="recordsBtn" style="margin-top:12px;">これまでの記録</button>
    </section>

    <section id="quiz" class="hidden">
      <div class="card">
        <div class="qhead">
          <span class="qcount" id="qCount"></span>
          <span class="qscore" id="qScore"></span>
        </div>
        <div class="bar"><i id="qBar" style="width:0%"></i></div>
        <div class="badges" id="qBadges"></div>
        <p class="qtext" id="qText"></p>
        <div class="choices" id="qChoices"></div>
        <div class="feedback hidden" id="qFeedback">
          <div class="verdict" id="qVerdict"></div>
          <div class="explain" id="qExplain"></div>
          <button class="report-link" id="qReport">この問題がおかしい？ 報告する</button>
        </div>
      </div>
      <button class="btn hidden" id="nextBtn">次の問題へ</button>
      <button class="btn sub" id="quitBtn" style="margin-top:8px;">やめて設定に戻る</button>
    </section>

    <section id="result" class="hidden">
      <div class="card">
        <div class="score-big">
          <div class="n"><span id="rScore"></span><small id="rTotal"></small></div>
          <div class="msg" id="rMsg"></div>
          <div class="bestline" id="rBest"></div>
        </div>
        <ul class="review" id="rReview"></ul>
      </div>
      <button class="btn" id="againBtn">同じ設定でもう一度</button>
      <button class="btn sub" id="backBtn" style="margin-top:8px;">設定を変える</button>
    </section>

    <section id="records" class="hidden">
      <div class="card">
        <div class="score-big">
          <div class="n" id="recPct"></div>
          <div class="msg" id="recSummary"></div>
        </div>
      </div>
      <div class="card" id="recBestCard">
        <h2>条件別ベスト</h2>
        <div id="recBest"></div>
      </div>
      <div class="card" id="recTagCard">
        <h2>問題の種類別</h2>
        <div id="recTags"></div>
      </div>
      <button class="btn sub" id="recBack">戻る</button>
      <button class="btn sub" id="recReset" style="margin-top:8px;">記録を消す</button>
    </section>
  </div>

  <!-- ================= 楽曲 ================= -->
  <div id="view-songs" class="hidden">
    <div class="modebar" data-tab="songs"></div>

    <div data-pane="songs-list">

<script src="quiz_data.js"></script>
<script>
(function(){
"use strict";

const D = window.QUIZ_DATA;

const GROUP_COLORS = {
  "乃木坂46":  {c:"#7030A0", f:"#fff"},
  "欅坂46":    {c:"#548235", f:"#fff"},
  "櫻坂46":    {c:"#F4B6C2", f:"#000"},
  "けやき坂46":{c:"#A9D18E", f:"#000"},
  "日向坂46":  {c:"#9DC3E6", f:"#000"},
  "=LOVE":     {c:"#F0537D", f:"#fff"},
  "≠ME":       {c:"#7FD9B0", f:"#000"},
  "≒JOY":      {c:"#FFD966", f:"#000"},
};

/* ---------------- 汎用ヘルパ ---------------- */
const $ = id => document.getElementById(id);
const rnd  = a => a[Math.floor(Math.random()*a.length)];
const shuf = a => { const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; };
const uniq = a => [...new Set(a)];
const esc  = s => String(s??"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// タグを外し、実体参照(&quot; など)も元に戻す。
// 『野中"まさ"雄一』のように名前に引用符を含む人がいるため、単純なタグ除去では足りない。
function plain(s){
  const d = document.createElement("div");
  d.innerHTML = String(s);
  return d.textContent;
}

const BAD = /要確認|不明|未確定|該当なし/;
function usable(v){
  if(!v) return false;
  const s = String(v).trim();
  if(!s || BAD.test(s)) return false;
  if(/^[-‐―–—ー]$/.test(s)) return false;
  if(s[0]==="(" || s[0]==="（") return false;
  return true;
}
/* 表記ゆれ対策。照合するときは必ず両側に同じ正規化をかける
   (片側だけだと "Carlos K." のような空白入りの名前が一致しなくなる) */
const nosp    = v => String(v).replace(/\s+/g, "");
const baseKey = v => nosp(String(v).replace(/[(（].*$/, "").trim());

function solo(v){
  if(!usable(v)) return false;
  const s = String(v);
  if(/[、，,・／\/&＆＋+]/.test(s)) return false;
  if(s.length > 24) return false;
  return true;
}
function involves(song, field, person){
  const v = nosp(song[field] || "");
  const p = baseKey(person);
  if(!v || !p) return false;
  return v.includes(p);
}
const notInvolved = (song, field, person) => !involves(song, field, person);

const bare  = t => { const m = String(t).match(/^「([^」]+)」$/); return m ? m[1] : String(t); };
const quote = t => `「${bare(t)}」`;
const songLabel = s => quote(s.title);
const songFull  = s => `${quote(s.title)}（${s.cd}／${s.date}）`;

function ordWord(n){
  const suf = (n%100>=10 && n%100<=20) ? "th" : ({1:"st",2:"nd",3:"rd"}[n%10] || "th");
  return n + suf;
}

/* 4択を組み立てる。正解と誤答が(表記ゆれ込みで)重複しないよう一意化する。
   誤答は「渡された順」に先頭から採用する(むずかしいモードでは紛らわしい順に
   並べて渡ってくるため)。最後に並びだけ混ぜるので、正解の位置は毎回変わる。 */
function makeChoices(answer, distractors, n=4){
  const seen = new Set([baseKey(answer)]);
  const pool = [];
  for(const d of distractors){
    if(!d) continue;
    const k = baseKey(d);
    if(seen.has(k)) continue;
    seen.add(k);
    pool.push(d);
  }
  if(pool.length < n-1) return null;
  return shuf([answer, ...pool.slice(0, n-1)]);
}
const Q = o => o;

/* ---------------- 難易度 ----------------
   難しさは3つのレバーで作っている。
   ① 出題範囲  : やさしい=表題曲・現役メンバーだけ / むずかしい=全部
   ② 誤答の近さ: むずかしいときは「同じCD」「同じ期」「近い年」から誤答を選ぶ(これが一番効く)
   ③ 問題の種類: やさしい=センターや誕生日 / むずかしい=編曲・振付・MV監督          */

const LEVELS = {
  easy: {
    label: "やさしい",
    song:   s => s.type === "表題",
    member: m => !String(m.status || "").includes("卒"),
    credits: ["lyricist", "composer"],
    near: false,                       // 誤答は遠いものから選ぶ
    weights: {
      center:22, "title-track":16, year:14, "member-birth":13, "member-group":13,
      "member-period":12, "member-center-song":10, "single-num":10, credit:10,
      "member-color":8, "same-period":8, oldest:5, "cd-title":4, "credit-which":4,
      "credit-not":0,                  // 0 は出題しない
    },
  },
  normal: {
    label: "ふつう",
    song: () => true, member: () => true,
    credits: null, near: false, weights: null,   // すべて既定どおり
  },
  hard: {
    label: "むずかしい",
    song: () => true, member: () => true,
    credits: ["arranger", "choreographer", "director", "composer"],
    near: true,                        // 誤答は紛らわしいものから選ぶ
    weights: {
      credit:20, "credit-which":16, "credit-not":16, "cd-title":12, "single-num":12,
      "member-color":10, "same-period":10, center:10, "member-center-song":8,
      oldest:8, year:8, "member-period":6, "member-birth":6, "title-track":4,
      "member-group":4,
    },
  },
};

/* 改名・派生で紛らわしいグループ(むずかしいときの誤答に使う) */
const SIBLING_GROUPS = {
  "欅坂46":["櫻坂46","けやき坂46","日向坂46"], "櫻坂46":["欅坂46","けやき坂46","日向坂46"],
  "けやき坂46":["日向坂46","欅坂46","櫻坂46"], "日向坂46":["けやき坂46","欅坂46","櫻坂46"],
  "乃木坂46":["櫻坂46","日向坂46","欅坂46"],
  "=LOVE":["≠ME","≒JOY"], "≠ME":["=LOVE","≒JOY"], "≒JOY":["=LOVE","≠ME"],
};

/* 同じ曲が複数のCDに入っていることがある(例: 日向坂46「ゴーフルと君」は
   7thシングルと2ndアルバムの両方に収録)。この場合「収録CDは?」「何thシングル?」
   「発売年は?」の答えが2つできてしまうので、重複している側の値は誤答から外す。 */
function twinValues(ctx, song, valueOf){
  const vals = new Set();
  for(const x of ctx.allSongs){
    if(x.g === song.g && x.title === song.title) vals.add(valueOf(x));
  }
  return vals;
}

/* 誤答候補を並べ替える。むずかしい: 紛らわしいものを先頭へ / それ以外: 完全ランダム */
function rank(ctx, list, isClose){
  if(!ctx.near || !isClose) return shuf(list);
  const near = [], far = [];
  for(const x of list) (isClose(x) ? near : far).push(x);
  return [...shuf(near), ...shuf(far)];
}

/* 数値の選択肢(年・CD番号)を、難易度に応じた離れ具合で作る */
function numberChoices(ctx, base, fmt, min, max){
  const offs = ctx.near ? [1,-1,2,-2,3,-3] : [3,-3,4,-4,2,-2,1,-1];
  const out = [];
  for(const d of offs){
    const n = base + d;
    if(n >= min && n <= max) out.push(fmt(n));
  }
  return out;
}

/* ---------------- 出題テンプレート ---------------- */
const CREDITS = [
  {key:"composer",      label:"作曲"},
  {key:"arranger",      label:"編曲"},
  {key:"lyricist",      label:"作詞"},
  {key:"choreographer", label:"振付"},
  {key:"director",      label:"MV監督"},
];
const creditsOf = ctx =>
  ctx.credits ? CREDITS.filter(c => ctx.credits.includes(c.key)) : CREDITS;

/* センター問題に使える曲か。単独センターで、かつ出題対象外の人でないこと */
const centerOK = (ctx, s) => solo(s.center) && !ctx.excluded.has(s.center);

const GENERATORS = [

{ id:"center", cat:"楽曲", weight:14, gen(ctx){
  const cands = ctx.songs.filter(s => centerOK(ctx, s));
  if(!cands.length) return null;
  const s = rnd(cands);
  const pool = ctx.songs.filter(x => x.g===s.g && centerOK(ctx, x) && x.center!==s.center);
  const others = rank(ctx, pool, x => x.cdBase === s.cdBase).map(x => x.center);
  const ch = makeChoices(s.center, others);
  if(!ch) return null;
  return Q({
    cat:"楽曲", group:s.g, tag:"センター", src:{song:s},
    text:`${s.g}の${songLabel(s)}でセンターを務めたのは?`,
    choices:ch, answer:s.center,
    explain:`${songFull(s)}<br>センター: <b>${esc(s.center)}</b>／種類: ${esc(s.type)}`
  });
}},

{ id:"credit", cat:"楽曲", weight:18, gen(ctx){
  const c = rnd(creditsOf(ctx));
  const cands = ctx.songs.filter(s => solo(s[c.key]));
  if(!cands.length) return null;
  const s = rnd(cands);
  const pool = ctx.songs.filter(x => x.g===s.g && solo(x[c.key]) && x[c.key]!==s[c.key]);
  const others = rank(ctx, pool, x => x.cdBase === s.cdBase).map(x => x[c.key]);
  const ch = makeChoices(s[c.key], others);
  if(!ch) return null;
  return Q({
    cat:"楽曲", group:s.g, tag:c.label, src:{song:s, field:c.key},
    text:`${s.g}${songLabel(s)}の<span class="em">${c.label}</span>を担当したのは?`,
    choices:ch, answer:s[c.key],
    explain:`${songFull(s)}<br>${c.label}: <b>${esc(s[c.key])}</b>`
  });
}},

{ id:"credit-which", cat:"楽曲", weight:12, gen(ctx){
  const c = rnd(creditsOf(ctx));
  const cands = ctx.songs.filter(s => solo(s[c.key]));
  if(!cands.length) return null;
  const s = rnd(cands);
  const person = s[c.key];
  const pool = ctx.songs.filter(x => x.g===s.g && x.title!==s.title && notInvolved(x, c.key, person));
  const wrong = rank(ctx, pool, x => x.cdBase === s.cdBase).map(x => x.title);
  const ch = makeChoices(s.title, wrong);
  if(!ch) return null;
  return Q({
    cat:"楽曲", group:s.g, tag:c.label+"逆引き", src:{song:s, field:c.key, person},
    text:`${s.g}の楽曲のうち、<span class="em">${esc(person)}</span>が${c.label}を担当したのは?`,
    choices:ch.map(t=>quote(t)), answer:quote(s.title),
    explain:`${songFull(s)}<br>${c.label}: <b>${esc(person)}</b>`
  });
}},

{ id:"credit-not", cat:"楽曲", weight:12, gen(ctx){
  const c = rnd(creditsOf(ctx));
  const cands = ctx.songs.filter(s => solo(s[c.key]));
  if(!cands.length) return null;
  const base = rnd(cands);
  const person = base[c.key];
  const mine = ctx.songs.filter(x => x.g===base.g && involves(x, c.key, person));
  if(mine.length < 3) return null;
  // 誤答(＝正解)側は、担当者がはっきり分かる曲だけにする(解説を出せるように)
  const wrongPool = ctx.songs.filter(x =>
    x.g===base.g && usable(x[c.key]) && notInvolved(x, c.key, person));
  if(!wrongPool.length) return null;
  const answer = rnd(rank(ctx, wrongPool, x => x.cdBase === base.cdBase));
  const three = rank(ctx, mine, x => x.cdBase === answer.cdBase).slice(0,3);
  if(three.length < 3 || three.some(x => x.title===answer.title)) return null;
  const titles = uniq([answer.title, ...three.map(x=>x.title)]);
  if(titles.length < 4) return null;
  return Q({
    cat:"楽曲", group:base.g, tag:c.label+"／除外",
    src:{song:answer, field:c.key, person, others:three.map(x=>x.title)},
    text:`次のうち、<span class="em">${esc(person)}</span>が${c.label}を担当して<span class="em">いない</span>のは?`,
    choices:shuf(titles).map(t=>quote(t)), answer:quote(answer.title),
    explain:`${songFull(answer)}<br>この曲の${c.label}は <b>${esc(answer[c.key])}</b>。<br>` +
            `他の3曲はいずれも ${esc(person)} が${c.label}を担当。`
  });
}},

{ id:"single-num", cat:"楽曲", weight:12, gen(ctx){
  const cands = ctx.songs.filter(s => s.num && s.kind);
  if(!cands.length) return null;
  const s = rnd(cands);
  const twins = twinValues(ctx, s, x => x.num ? `${ordWord(x.num)}${x.kind}` : "");
  const near = numberChoices(ctx, s.num, n => `${ordWord(n)}${s.kind}`, 1, 99)
                 .filter(v => !twins.has(v));
  const ch = makeChoices(`${ordWord(s.num)}${s.kind}`, near);
  if(!ch) return null;
  return Q({
    cat:"楽曲", group:s.g, tag:"収録CD", src:{song:s},
    text:`${s.g}${songLabel(s)}が収録されているのは?`,
    choices:ch, answer:`${ordWord(s.num)}${s.kind}`,
    explain:`${songFull(s)}<br>収録: <b>${esc(s.cd)}</b>（${s.date} 発売）`
  });
}},

{ id:"cd-title", cat:"楽曲", weight:10, gen(ctx){
  const cands = ctx.songs.filter(s => usable(s.cdBase) && s.cdBase !== s.title);
  if(!cands.length) return null;
  const s = rnd(cands);
  const twins = twinValues(ctx, s, x => x.cdBase);
  const pool = ctx.songs.filter(x => x.g===s.g && usable(x.cdBase) && !twins.has(x.cdBase));
  const others = rank(ctx, pool, x => x.year === s.year).map(x => x.cdBase);
  const ch = makeChoices(s.cdBase, others);
  if(!ch) return null;
  return Q({
    cat:"楽曲", group:s.g, tag:"収録CD", src:{song:s},
    text:`${s.g}${songLabel(s)}が収録されているCDのタイトルは?`,
    choices:ch.map(t=>quote(t)), answer:quote(s.cdBase),
    explain:`${songFull(s)}<br>収録CD: <b>${esc(s.cd)}</b>`
  });
}},

{ id:"year", cat:"楽曲", weight:8, gen(ctx){
  const cands = ctx.songs.filter(s => s.year);
  if(!cands.length) return null;
  const s = rnd(cands);
  const y = parseInt(s.year,10);
  const twins = twinValues(ctx, s, x => x.year);
  const near = numberChoices(ctx, y, n => String(n), 2011, 2026)
                 .filter(v => !twins.has(v));
  const ch = makeChoices(s.year, near);
  if(!ch) return null;
  return Q({
    cat:"楽曲", group:s.g, tag:"発売年", src:{song:s},
    text:`${s.g}${songLabel(s)}がリリースされたのは何年?`,
    choices:ch.map(v=>v+"年"), answer:s.year+"年",
    explain:`${songFull(s)}<br>発売日: <b>${s.date}</b>`
  });
}},

{ id:"title-track", cat:"楽曲", weight:8, gen(ctx){
  const g = rnd(uniq(ctx.songs.map(s=>s.g)));
  const hits = ctx.songs.filter(s => s.g===g && s.type==="表題");
  // 誤答は範囲を絞らない全曲から取る(やさしいモードでも成立させるため)
  const missPool = ctx.allSongs.filter(s => s.g===g && s.type && s.type!=="表題");
  if(!hits.length || missPool.length<3) return null;
  const s = rnd(hits);
  const miss = rank(ctx, missPool, x => x.cdBase === s.cdBase).map(x=>x.title);
  const ch = makeChoices(s.title, miss);
  if(!ch) return null;
  return Q({
    cat:"楽曲", group:g, tag:"表題曲", src:{song:s},
    text:`次のうち、${g}の<span class="em">表題曲</span>はどれ?`,
    choices:ch.map(t=>quote(t)), answer:quote(s.title),
    explain:`${songFull(s)}<br>種類: <b>表題</b>／センター: ${usable(s.center)?esc(s.center):"—"}`
  });
}},

{ id:"oldest", cat:"楽曲", weight:7, gen(ctx){
  const g = rnd(uniq(ctx.songs.map(s=>s.g)));
  const gs = ctx.songs.filter(s=>s.g===g && s.date);
  // 発売日が同じ曲・同名の曲は1つに絞る(答えが一意にならなくなるため)
  const byDate = {}, seenTitle = new Set();
  gs.forEach(s => {
    if(byDate[s.date] || seenTitle.has(s.title)) return;
    byDate[s.date] = s; seenTitle.add(s.title);
  });
  let list = Object.values(byDate);
  if(list.length < 4) return null;
  // むずかしい: 発売日が近い4曲 / それ以外: バラバラに選ぶ
  let picks;
  if(ctx.near){
    list.sort((a,b)=>a.date.localeCompare(b.date));
    const i = Math.floor(Math.random() * (list.length - 3));
    picks = list.slice(i, i+4);
  } else {
    picks = shuf(list).slice(0,4);
  }
  const sorted = picks.slice().sort((a,b)=>a.date.localeCompare(b.date));
  const ans = sorted[0];
  return Q({
    cat:"楽曲", group:g, tag:"リリース順", src:{songs:picks.map(s=>s.title)},
    text:`次の${g}の楽曲のうち、<span class="em">最も古い</span>のは?`,
    choices:shuf(picks).map(s=>quote(s.title)), answer:quote(ans.title),
    explain: sorted.map(s=>`${s.date}　${songLabel(s)}`).join("<br>")
  });
}},

{ id:"member-center-song", cat:"両方", weight:9, gen(ctx){
  const cands = ctx.songs.filter(s => centerOK(ctx, s));
  if(!cands.length) return null;
  const s = rnd(cands);
  const pool = ctx.songs.filter(x => x.g===s.g && centerOK(ctx, x) && x.center!==s.center);
  const wrong = rank(ctx, pool, x => x.cdBase === s.cdBase).map(x => x.title);
  const ch = makeChoices(s.title, wrong);
  if(!ch) return null;
  return Q({
    cat:"楽曲", group:s.g, tag:"センター逆引き", src:{song:s},
    text:`${s.g}の<span class="em">${esc(s.center)}</span>がセンターを務めたのは?`,
    choices:ch.map(t=>quote(t)), answer:quote(s.title),
    explain:`${songFull(s)}<br>センター: <b>${esc(s.center)}</b>`
  });
}},

{ id:"member-period", cat:"メンバー", weight:11, gen(ctx){
  const cands = ctx.members.filter(m => usable(m.period));
  if(!cands.length) return null;
  const m = rnd(cands);
  const n = periodNum(m.period);
  const pool = ctx.members.filter(x => x.g===m.g && usable(x.period) && x.period!==m.period);
  const others = rank(ctx, pool, x => Math.abs(periodNum(x.period) - n) <= 1).map(x => x.period);
  const ch = makeChoices(m.period, others);
  if(!ch) return null;
  return Q({
    cat:"メンバー", group:m.g, tag:"期", src:{member:m},
    text:`${m.g}の<span class="em">${esc(m.name)}</span>は何期生?`,
    choices:ch, answer:m.period,
    explain:`<b>${esc(m.name)}</b>（${m.g}）<br>${esc(m.period)}／${esc(m.status)}／在籍: ${esc(m.tenure)}`
  });
}},

{ id:"member-color", cat:"メンバー", weight:11, gen(ctx){
  const cands = ctx.members.filter(m => usable(m.color));
  if(!cands.length) return null;
  const m = rnd(cands);
  const pool = ctx.members.filter(x => x.g===m.g && usable(x.color) && x.color!==m.color);
  const others = rank(ctx, pool, x => x.period === m.period).map(x => x.color);
  const ch = makeChoices(m.color, others);
  if(!ch) return null;
  return Q({
    cat:"メンバー", group:m.g, tag:"サイリウムカラー", src:{member:m},
    text:`${m.g}の<span class="em">${esc(m.name)}</span>のサイリウムカラーは?`,
    choices:ch, answer:m.color,
    explain:`<b>${esc(m.name)}</b>（${m.g}）<br>サイリウムカラー: <b>${esc(m.color)}</b>／${esc(m.period)}`
  });
}},

{ id:"member-birth", cat:"メンバー", weight:8, gen(ctx){
  const cands = ctx.members.filter(m => /^\d{2}\/\d{2}$/.test(m.birthday||""));
  if(!cands.length) return null;
  const m = rnd(cands);
  const mm = parseInt(m.birthday.slice(0,2),10);
  const wrap = n => ((n - 1 + 12) % 12) + 1;          // 1〜12に丸める
  const offs = ctx.near ? [1,-1,2,-2] : [5,-5,6,4,-4];
  const near = uniq(offs.map(d => wrap(mm + d)).filter(n => n !== mm)).map(n => n + "月");
  const ch = makeChoices(mm+"月", near);
  if(!ch) return null;
  return Q({
    cat:"メンバー", group:m.g, tag:"誕生日", src:{member:m},
    text:`${m.g}の<span class="em">${esc(m.name)}</span>の誕生日は何月?`,
    choices:ch, answer:mm+"月",
    explain:`<b>${esc(m.name)}</b>（${m.g}）<br>誕生日: <b>${m.birthday}</b>／${esc(m.period)}`
  });
}},

{ id:"member-group", cat:"メンバー", weight:9, gen(ctx){
  const cands = ctx.members.filter(m => m.uniqueGroup);
  if(!cands.length) return null;
  const m = rnd(cands);
  const sib = SIBLING_GROUPS[m.g] || [];
  const pool = D.groups.filter(g => g!==m.g);
  const ch = makeChoices(m.g, rank(ctx, pool, g => sib.includes(g)));
  if(!ch) return null;
  return Q({
    cat:"メンバー", group:m.g, tag:"所属グループ", src:{member:m},
    text:`<span class="em">${esc(m.name)}</span>が所属している(していた)グループは?`,
    choices:ch, answer:m.g,
    explain:`<b>${esc(m.name)}</b>／${m.g} ${esc(m.period)}<br>在籍: ${esc(m.tenure)}`
  });
}},

{ id:"same-period", cat:"メンバー", weight:8, gen(ctx){
  const m = rnd(ctx.members.filter(x => usable(x.period)));
  if(!m) return null;
  const n = periodNum(m.period);
  const same = ctx.members.filter(x => x.g===m.g && x.period===m.period && x.name!==m.name);
  const diff = ctx.members.filter(x => x.g===m.g && usable(x.period) && x.period!==m.period);
  if(!same.length || diff.length<3) return null;
  const ans = rnd(same);
  const others = rank(ctx, diff, x => Math.abs(periodNum(x.period) - n) <= 1).map(x => x.name);
  const ch = makeChoices(ans.name, others);
  if(!ch) return null;
  return Q({
    cat:"メンバー", group:m.g, tag:"同期", src:{member:m, other:ans.name},
    text:`${m.g}の<span class="em">${esc(m.name)}</span>と<span class="em">同じ期</span>のメンバーは?`,
    choices:ch, answer:ans.name,
    explain:`<b>${esc(m.name)}</b> と <b>${esc(ans.name)}</b> はどちらも ${m.g} ${esc(m.period)}。`
  });
}},

];

/* ジャンル「作曲・編曲」で出すクレジットと、その問題の種類 */
const CREDIT_CAT_KEYS = ["composer", "arranger"];
const CREDIT_CAT_GENS = ["credit", "credit-which", "credit-not"];

function buildContext(groups, levelKey, cat){
  const lv = LEVELS[levelKey] || LEVELS.normal;
  const allSongs   = D.songs.filter(s => groups.includes(s.g));
  // 2014年までに卒業した人は分かっていることが少ないので出題しない
  const allMembers = D.members.filter(m => groups.includes(m.g) && !isEarlyGrad(m));
  let songs   = allSongs.filter(lv.song);
  let members = allMembers.filter(lv.member);
  // 絞り込みで枯れてしまう場合は全体に戻す(問題が作れなくなるのを防ぐ)
  if(songs.length   < 8) songs   = allSongs;
  if(members.length < 8) members = allMembers;

  // ジャンルで明示的に選ばれている場合はそちらを優先する。
  // (難易度は出題範囲と誤答の紛らわしさで効かせる。ここで絞ると
  //  「作曲・編曲」を選んだのに編曲が出ない、ということが起きる)
  const credits = (cat === "credit") ? CREDIT_CAT_KEYS : lv.credits;
  // 2014年までに卒業した人は、曲のセンターとしても出題しない
  const excluded = new Set(D.members.filter(isEarlyGrad).map(m => m.name));

  return { songs, members, allSongs, allMembers, excluded,
           near: lv.near, credits, level: levelKey };
}
function pickGenerators(cat, levelKey){
  const lv = LEVELS[levelKey] || LEVELS.normal;
  return GENERATORS.filter(g => {
    if(lv.weights && lv.weights[g.id] === 0) return false;
    if(cat==="both") return true;
    if(cat==="song")   return g.cat==="楽曲" || g.cat==="両方";
    if(cat==="member") return g.cat==="メンバー" || g.cat==="両方";
    if(cat==="credit") return CREDIT_CAT_GENS.includes(g.id);
    return true;
  });
}
function weightedPick(gens, levelKey){
  const lv = LEVELS[levelKey] || LEVELS.normal;
  const w = g => (lv.weights && lv.weights[g.id] != null) ? lv.weights[g.id] : g.weight;
  const total = gens.reduce((a,g)=>a+w(g),0);
  let r = Math.random()*total;
  for(const g of gens){ r -= w(g); if(r<=0) return g; }
  return gens[gens.length-1];
}
function buildQuiz(groups, cat, count, levelKey="normal"){
  const ctx = buildContext(groups, levelKey, cat);
  const gens = pickGenerators(cat, levelKey);
  if(!gens.length) return [];
  const out = [], seen = new Set();
  let guard = 0;
  while(out.length < count && guard < count*400){
    guard++;
    const g = weightedPick(gens, levelKey);
    let q = null;
    try { q = g.gen(ctx); } catch(e) { q = null; }
    if(!q || !q.choices || q.choices.length<4) continue;
    if(!q.choices.includes(q.answer)) continue;
    const key = g.id + "|" + q.text;
    if(seen.has(key)) continue;
    seen.add(key);
    q.genId = g.id;
    q.level = levelKey;
    out.push(q);
  }
  return out;
}

/* 坂道グループとイコノイジョイの境目。ここでチップを折り返す */
const GROUP_BREAK_BEFORE = "=LOVE";

/* グループの選択チップを作る。全タブで同じ挙動にするためここにまとめてある。
   全部選ばれている状態で1つ押したときは「そのグループだけ」に絞る。
   (全部入りから1つに絞りたい場面が多く、7回押させるのは手間なので) */
function makeGroupChips(box, sel, onChange, small){
  box.innerHTML = "";
  const paint = () => [...box.children].forEach(b => {
    if(b.dataset.g) b.setAttribute("aria-pressed", sel.has(b.dataset.g));
  });
  D.groups.forEach(g => {
    if(g === GROUP_BREAK_BEFORE){
      const br = document.createElement("span");      // flexの行を折り返すための空要素
      br.style.cssText = "flex-basis:100%; height:0;";
      box.appendChild(br);
    }
    const col = GROUP_COLORS[g] || {c:"#26314f", f:"#fff"};
    const b = document.createElement("button");
    b.className = "chip" + (small ? " sm" : "");
    b.textContent = g;
    b.dataset.color = "1";
    b.dataset.g = g;
    b.style.setProperty("--c", col.c);
    b.style.setProperty("--cf", col.f);
    b.onclick = () => {
      if(sel.size === D.groups.length){ sel.clear(); sel.add(g); }   // 全選択 → これだけ
      else if(sel.has(g))              { sel.delete(g); }
      else                             { sel.add(g); }
      paint();
      onChange();
    };
    box.appendChild(b);
  });
  paint();
}

/* ================= 記録(この端末の中だけに保存) ================= */
const REC_KEY = "sakamichi_quiz_records";
const CAT_LABELS = {both:"楽曲＋メンバー", song:"楽曲だけ", member:"メンバーだけ", credit:"作曲・編曲"};

function loadRecords(){
  try {
    const r = JSON.parse(localStorage.getItem(REC_KEY) || "{}");
    return { plays:0, questions:0, correct:0, best:{}, byTag:{}, ...r };
  } catch(e) {
    return { plays:0, questions:0, correct:0, best:{}, byTag:{} };
  }
}
function saveRecords(r){
  try { localStorage.setItem(REC_KEY, JSON.stringify(r)); } catch(e){}
}
const condKey   = () => `${state.cat}|${state.level}|${state.count}`;
const condLabel = k => {
  const [cat, lv, n] = k.split("|");
  return `${CAT_LABELS[cat] || cat}／${(LEVELS[lv]||{}).label || lv}／${n}問`;
};
const pctOf = (c, n) => n ? Math.round(c / n * 100) : 0;

/* 1回分の結果を記録に反映し、自己ベストを更新したかどうかを返す */
function recordResult(){
  const r = loadRecords();
  const total = state.quiz.length, sc = state.score;
  r.plays     += 1;
  r.questions += total;
  r.correct   += sc;

  state.log.forEach(l => {
    const t = l.q.tag;
    if(!r.byTag[t]) r.byTag[t] = {c:0, n:0};
    r.byTag[t].n += 1;
    if(l.ok) r.byTag[t].c += 1;
  });

  const key = condKey();
  const prev = r.best[key];
  const pct  = pctOf(sc, total);
  const updated = !prev || pct > prev.pct;
  if(updated) r.best[key] = {pct, correct:sc, total, at:new Date().toISOString()};

  saveRecords(r);
  return {updated, prev, pct, rec:r};
}
function startQuiz(){
  const quiz = buildQuiz([...state.groups], state.cat, state.count, state.level);
  if(!quiz.length){ alert("この条件では問題を作れませんでした。グループやジャンルを増やしてみてください。"); return; }
  state.quiz = quiz; state.idx = 0; state.score = 0; state.log = [];
  showQuizSection("quiz");
  renderQuestion();
}
function renderQuestion(){
  const q = state.quiz[state.idx], total = state.quiz.length;
  $("qCount").textContent = `第 ${state.idx+1} 問 / 全 ${total} 問`;
  $("qScore").textContent = `正解 ${state.score}`;
  $("qBar").style.width = (state.idx/total*100) + "%";
  const col = GROUP_COLORS[q.group] || {c:"#26314f", f:"#fff"};
  $("qBadges").innerHTML =
    `<span class="badge" style="background:${col.c};color:${col.f}">${esc(q.group)}</span>` +
    `<span class="badge tag">${esc(q.tag)}</span>` +
    (state.level!=="normal"
      ? `<span class="badge tag">${LEVELS[state.level].label}</span>` : "");
  $("qText").innerHTML = q.text;
  const box = $("qChoices"); box.innerHTML = "";
  q.choices.forEach((c,i) => {
    const b = document.createElement("button");
    b.className = "choice"; b.dataset.value = c;
    b.innerHTML = `<span class="no">${"ABCD"[i]}</span><span></span>`;
    b.lastElementChild.textContent = c;
    b.onclick = () => answer(b, c);
    box.appendChild(b);
  });
  $("qFeedback").classList.add("hidden");
  $("nextBtn").classList.add("hidden");
  const rl = $("qReport");
  rl.textContent = "この問題がおかしい？ 報告する";
  rl.classList.remove("done"); rl.disabled = false;
}
function answer(btn, choice){
  const q = state.quiz[state.idx];
  const ok = choice === q.answer;
  if(ok) state.score++;
  state.log.push({q, choice, ok});
  [...$("qChoices").children].forEach(b => {
    b.disabled = true;
    if(b.dataset.value === q.answer) b.classList.add("correct");
    else if(b===btn) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  $("qVerdict").className = "verdict " + (ok ? "ok" : "ng");
  $("qVerdict").textContent = ok ? "正解！" : `不正解　正解は ${q.answer}`;
  $("qExplain").innerHTML = q.explain;
  $("qFeedback").classList.remove("hidden");
  $("qScore").textContent = `正解 ${state.score}`;
  $("qBar").style.width = ((state.idx+1)/state.quiz.length*100) + "%";
  const btnNext = $("nextBtn");
  btnNext.textContent = (state.idx+1 >= state.quiz.length) ? "結果を見る" : "次の問題へ";
  btnNext.classList.remove("hidden");
}
$("nextBtn").onclick = () => {
  state.idx++;
  if(state.idx >= state.quiz.length) renderResult(); else renderQuestion();
};
$("startBtn").onclick = startQuiz;
$("againBtn").onclick = startQuiz;
$("quitBtn").onclick  = () => showQuizSection("setup");
$("backBtn").onclick  = () => showQuizSection("setup");
$("recBack").onclick  = () => showQuizSection("setup");
$("recordsBtn").onclick = () => { renderRecords(); showQuizSection("records"); };
$("recReset").onclick = () => {
  if(!confirm("これまでの記録をすべて消します。よろしいですか？")) return;
  try { localStorage.removeItem(REC_KEY); } catch(e){}
  renderRecords();
};

function renderRecords(){
  const r = loadRecords();
  const pct = pctOf(r.correct, r.questions);

  $("recPct").innerHTML = r.plays
    ? `${pct}<small>%</small>`
    : `<span style="font-size:20px;color:var(--muted);">—</span>`;
  $("recSummary").textContent = r.plays
    ? `${r.plays}回プレイ　${r.correct}/${r.questions}問正解`
    : "まだ記録がありません";
  $("recReset").classList.toggle("hidden", !r.plays);

  // 条件別ベスト(正答率の高い順)
  const best = Object.entries(r.best).sort((a,b) => b[1].pct - a[1].pct);
  $("recBestCard").classList.toggle("hidden", !best.length);
  $("recBest").innerHTML = best.map(([k,v]) => `
    <div class="recrow">
      <span class="k">${esc(condLabel(k))}</span>
      <span class="v">${v.correct}/${v.total}（${v.pct}%）</span>
    </div>`).join("");

  // 問題の種類別(正答率の低い順＝苦手が上に来る)
  const tags = Object.entries(r.byTag)
    .filter(([,v]) => v.n >= 3)
    .sort((a,b) => pctOf(a[1].c,a[1].n) - pctOf(b[1].c,b[1].n));
  $("recTagCard").classList.toggle("hidden", !tags.length);
  $("recTags").innerHTML = tags.map(([t,v]) => {
    const p = pctOf(v.c, v.n);
    return `
      <div class="recitem">
        <div class="top">
          <span class="k">${esc(t)}</span>
          <span class="v">${v.c}/${v.n}（${p}%）</span>
        </div>
        <div class="recbar"><i style="width:${p}%"></i></div>
      </div>`;
  }).join("");
}

function renderResult(){
  const total = state.quiz.length, sc = state.score, pct = Math.round(sc/total*100);
  $("rScore").textContent = sc;
  $("rTotal").textContent = ` / ${total}`;
  const msg = pct===100 ? "全問正解！完璧です" : pct>=80 ? "かなり詳しい" :
              pct>=60 ? "good、あと少し" : pct>=40 ? "まずまず" : "これから覚えていきましょう";
  $("rMsg").textContent = `正答率 ${pct}%　—　${msg}`;

  const {updated, prev, rec} = recordResult();
  const bl = $("rBest");
  bl.className = "bestline" + (updated ? " up" : "");
  if(updated){
    bl.textContent = prev
      ? `自己ベスト更新　${prev.correct}/${prev.total}（${prev.pct}%）→ ${sc}/${total}（${pct}%）`
      : `自己ベスト　${sc}/${total}（${pct}%）`;
  } else {
    const b = rec.best[condKey()];
    bl.textContent = `自己ベスト ${b.correct}/${b.total}（${b.pct}%）　通算 ${rec.plays}回・正答率 ${pctOf(rec.correct, rec.questions)}%`;
  }

  const ul = $("rReview"); ul.innerHTML = "";
  state.log.forEach((l,i) => {
    const li = document.createElement("li");
    li.innerHTML =
      `<span class="mk ${l.ok?"ok":"ng"}">${l.ok?"○":"×"}</span>` +
      `<span><span>${i+1}. ${esc(plain(l.q.text))}</span>` +
      (l.ok ? "" : `<div class="ans">あなた: ${esc(l.choice)}　／　正解: ${esc(l.q.answer)}</div>`) +
      `</span>`;
    ul.appendChild(li);
  });
  showQuizSection("result");
}

  ["パステルブルー","#a8d5f2"],["サクラピンク","#f7c5d3"],["パールグリーン","#c3e3c4"],

  ["ホワイト","#ffffff"],["ブラック","#2a2a2a"],["レッド","#e2372f"],["ブルー","#2f6fd0"],
  ["イエロー","#f5cf3d"],["グリーン","#3fa85f"],["パープル","#7b3fa0"],["オレンジ","#f0913a"],

  ["菫","#6f4fd0"],["金","#d9b64e"],["銀","#c8ccd2"],

function colorSwatches(v){
  if(!usable(v)) return "";
  const parts = String(v).split(/[×✕x╳／\/・]/).map(s=>s.trim()).filter(Boolean).slice(0,3);
  const hexes = [];
  for(const p of parts){
    const hit = COLOR_HEX.find(([name]) => p.includes(name));
    if(hit) hexes.push(hit[1]);
  }
  if(!hexes.length) return "";
  return `<span class="swatches">` +
    hexes.map(h=>`<i class="sw" style="background:${h}"></i>`).join("") + `</span>`;
}

/* 「秋元康、○○」のような併記を分解して1人ずつにする。
   中黒(・)は「白石麻衣・西野七瀬」のような区切りにも、
   「デレク・ターナー」のような名前の一部にも使われるので、
   漢字を含むときだけ区切りとみなす。 */
function splitPeople(v){
  if(!usable(v)) return [];
  const hasKanji = s => /[一-鿿]/.test(s);
  const out = [];
  for(const part of String(v).split(/[、，,／\/＆&＋+]/)){
    if(part.includes("・") && hasKanji(part)) out.push(...part.split("・"));
    else out.push(part);
  }
  return out
    .map(s => s.trim())
    .filter(s => s && !BAD.test(s) && !/^[-‐―–—ー]$/.test(s) && s[0] !== "(" && s[0] !== "（");
}

/* 在籍期間を日数にする。現役(終わりなし)は今日まで。読めないものは null */
function tenureDays(t){
  const m = String(t || "").match(/^(\d{4})\/(\d{2})\/(\d{2})\s*～\s*(?:(\d{4})\/(\d{2})\/(\d{2}))?\s*$/);
  if(!m) return null;
  const start = new Date(+m[1], +m[2]-1, +m[3]);
  const end   = m[4] ? new Date(+m[4], +m[5]-1, +m[6]) : new Date();
  const days  = Math.round((end - start) / 86400000);
  return days >= 0 ? {days, ongoing: !m[4]} : null;
}
function daysLabel(d){
  const y = Math.floor(d / 365.25);
  const mo = Math.round((d - y * 365.25) / 30.44);
  return y ? `${y}年${mo ? mo + "か月" : ""}` : `${mo}か月`;
}

const RANKINGS = [
  {id:"center-title",  label:"表題センター", src:"song", field:"center",
   only:s => s.type === "表題", unit:"曲"},

/* カッコ書きを落として表示名にする。
   データには「TAKAHIRO(単独ソース)」「LICO（ライブ）」のように
   注記が付いたものが混ざっているため。空白は名前の一部なので残す。 */
const cleanName = v => String(v).replace(/[(（].*$/, "").trim() || String(v).trim();

/* 表記ゆれ(「TAKAHIRO」と「TAKAHIRO(単独ソース)」)を1つにまとめて数える */
function tally(rows, keyOf, itemOf){
  const map = new Map();
  for(const row of rows){
    for(const raw of keyOf(row)){
      const k = baseKey(raw);
      if(!k) continue;
      if(!map.has(k)) map.set(k, {label: cleanName(raw), n: 0, items: []});
      const e = map.get(k);
      e.n += 1;
      if(e.items.length < 60) e.items.push(itemOf(row));
    }
  }
  return [...map.values()];
}

function computeRanking(kindId, groups){
  const r = RANKINGS.find(x => x.id === kindId) || RANKINGS[0];

  if(r.src === "tenure"){
    const list = [];
    for(const m of D.members){
      if(!groups.includes(m.g)) continue;
      const t = tenureDays(m.tenure);
      if(!t) continue;
      list.push({
        label: m.name, n: t.days,
        sub: `${m.g}　${m.period}${t.ongoing ? "　在籍中" : ""}`,
        value: daysLabel(t.days),
        items: [`${m.tenure}`],
      });
    }
    return list.sort((a,b) => b.n - a.n);
  }

  const songs = D.songs.filter(s => groups.includes(s.g) && (!r.only || r.only(s)));

  if(r.src === "year"){
    const list = tally(songs, s => (s.year ? [s.year] : []),
                       s => `${bare(s.title)}／${s.g}`);
    return list
      .map(e => ({...e, label: e.label + "年", value: `${e.n}${r.unit}`, sub: ""}))
      .sort((a,b) => a.label.localeCompare(b.label));
  }

  if(r.src === "group"){
    const list = tally(songs, s => [s.g], s => `${bare(s.title)}／${s.cd}`);
    return list
      .map(e => ({...e, value: `${e.n}${r.unit}`, sub: ""}))
      .sort((a,b) => b.n - a.n);
  }

  const list = tally(songs, s => splitPeople(s[r.field]),
                     s => `${bare(s.title)}／${s.g}／${s.cd}`);
  return list
    .map(e => ({...e, value: `${e.n}${r.unit}`, sub: ""}))
    .sort((a,b) => b.n - a.n || a.label.localeCompare(b.label, "ja"));
}

      </div>`).join("") : `<p class="empty">該当がありません</p>`;

    moreEl.classList.toggle("hidden", list.length <= state.limit);

  const kc = el("kinds");

      [...kc.children].forEach(x => x.setAttribute("aria-pressed", x === b));
      render();
    };
    kc.appendChild(b);
  });

  makeGroupChips(el("groups"), state.groups,
                 () => { state.limit = 30; render(); }, true);

  moreEl.onclick = () => { state.limit += 30; render(); };

    toggleRow(row, () => {

            ? `<span class="cd">　${esc(p.slice(1).join("／"))}</span>` : ""}</div>`;

        (e2.n > e2.items.length ? `<div class="cd">ほか ${e2.n - e2.items.length}件</div>` : "") +
        `</div>`;
    });
  });

  render();
}

/* ================= 作曲・編曲(制作者の一覧) ================= */
const ROLES = [
  {key:"composer",      label:"作曲"},
  {key:"arranger",      label:"編曲"},
  {key:"lyricist",      label:"作詞"},
  {key:"choreographer", label:"振付"},
  {key:"director",      label:"MV監督"},
];
const crState = { q:"", roles:new Set(["composer","arranger"]),
                  groups:new Set(D.groups), limit:60 };
let crInit = false;

/* 制作者ごとに担当曲をまとめる。
   同じ曲で作曲と編曲の両方を担当していれば1行にまとめ、「作曲・編曲」と出す。 */
function buildCreators(){
  const map = new Map();
  for(const s of D.songs){
    if(!crState.groups.has(s.g)) continue;
    for(const role of ROLES){
      if(!crState.roles.has(role.key)) continue;
      for(const raw of splitPeople(s[role.key])){
        const k = baseKey(raw);
        if(!k) continue;
        if(!map.has(k)) map.set(k, {name: cleanName(raw), roles:{}, songs: new Map()});
        const e = map.get(k);
        e.roles[role.label] = (e.roles[role.label] || 0) + 1;

        const sk = `${s.g}|${s.title}|${s.cd}`;
        if(!e.songs.has(sk)){
          e.songs.set(sk, {title: bare(s.title), g: s.g, cd: s.cd,
                           date: s.date || "", roles: []});
        }
        e.songs.get(sk).roles.push(role.label);
      }
    }
  }
  let list = [...map.values()].map(e => ({
    name: e.name,
    roles: e.roles,
    n: e.songs.size,                       // 曲数(役割の延べ数ではなく実際の曲数)
    items: [...e.songs.values()].sort((a,b) => a.date.localeCompare(b.date)),
  }));
  const q = crState.q.trim().toLowerCase();
  if(q) list = list.filter(e => e.name.toLowerCase().includes(q));
  return list.sort((a,b) => b.n - a.n || a.name.localeCompare(b.name, "ja"));
}

function renderCreators(){
  const list = buildCreators();
  $("crCount").textContent = `${list.length}人`;
  const shown = list.slice(0, crState.limit);
  $("crRows").innerHTML = shown.length ? shown.map((e, i) => {
    const roles = Object.entries(e.roles)
      .map(([r, n]) => `<span class="ttag">${esc(r)} ${n}</span>`).join("");
    return `
      <div class="row" data-i="${i}">
        <button type="button">
          <span class="gbar" style="background:var(--line)"></span>
          <span class="body">
            <span class="t1">${esc(e.name)}</span>
            <span class="t2">${esc(String(e.n))}曲</span>
            <span class="t3">${roles}</span>
          </span>
          <span class="chev">▶</span>
        </button>
      </div>`;
  }).join("") : `<p class="empty">該当がありません</p>`;
  $("crRows")._list = shown;
  $("crMore").classList.toggle("hidden", list.length <= crState.limit);
  $("crMore").textContent = `さらに表示（残り ${Math.max(0, list.length - crState.limit)}人）`;
}

/* 担当曲の一覧。役割 → 曲名 → グループ/CD の順に並べる */
function creatorSongsHTML(e){
  const order = ROLES.map(r => r.label);
  return `<div class="crsongs">` + e.items.map(s => {
    const roles = order.filter(r => s.roles.includes(r)).join("・");
    return `
      <div class="crsong">
        <span class="rl">${esc(roles)}</span>
        <span class="body">
          <span class="ti">${esc(s.title)}</span>
          <span class="mt">${esc(s.g)}　${esc(s.cd)}</span>
        </span>
      </div>`;
  }).join("") + `</div>`;
}

function initCreators(){
  crInit = true;
  const rc = $("crRoles");
  ROLES.forEach(r => {
    const b = document.createElement("button");
    b.className = "chip sm"; b.textContent = r.label;
    b.setAttribute("aria-pressed", crState.roles.has(r.key));
    b.onclick = () => {
      crState.roles.has(r.key) ? crState.roles.delete(r.key) : crState.roles.add(r.key);
      b.setAttribute("aria-pressed", crState.roles.has(r.key));
      crState.limit = 60; renderCreators();
    };
    rc.appendChild(b);
  });
  makeGroupChips($("crGroups"), crState.groups,
                 () => { crState.limit = 60; renderCreators(); }, true);
  $("crSearch").oninput = e => { crState.q = e.target.value; crState.limit = 60; renderCreators(); };
  $("crMore").onclick = () => { crState.limit += 60; renderCreators(); };
  $("crRows").addEventListener("click", e => {
    const row = e.target.closest(".row"); if(!row) return;
    toggleRow(row, () => creatorSongsHTML($("crRows")._list[+row.dataset.i]));
  });
  renderCreators();
}

/* ================= 一覧 / ランキング の切替 ================= */
const TAB_MODES = {};   // tab名 -> "list" | "rank"

function initModebars(){
  document.querySelectorAll(".modebar").forEach(bar => {
    const tab = bar.dataset.tab;
    TAB_MODES[tab] = "list";
    [["list","一覧"],["rank","ランキング"]].forEach(([mode, label]) => {
      const b = document.createElement("button");
      b.textContent = label;
      b.setAttribute("aria-pressed", mode === "list");
      b.onclick = () => {
        TAB_MODES[tab] = mode;
        [...bar.children].forEach(x => x.setAttribute("aria-pressed", x === b));
        showPane(tab);
      };
      bar.appendChild(b);
    });
  });
}
function showPane(tab){
  const mode = TAB_MODES[tab] || "list";
  document.querySelector(`[data-pane="${tab}-list"]`).classList.toggle("hidden", mode !== "list");
  const rankPane = document.querySelector(`[data-pane="${tab}-rank"]`);
  rankPane.classList.toggle("hidden", mode !== "rank");
  if(mode === "rank" && !rankPane.dataset.ready){
    rankPane.dataset.ready = "1";
    buildRankPane(rankPane, RANK_SETS[tab]);
  }
  window.scrollTo({top:0});
}

function toggleRow(row, html){
  const open = row.classList.toggle("open");
  const cur = row.querySelector(".detail");
  if(cur) cur.remove();
  if(open) row.insertAdjacentHTML("beforeend", html());
}

/* ================= 報告 ================= */
const REP_KEY = "sakamichi_quiz_reports";
const REP_KINDS = ["正解が間違っている","選択肢がおかしい","問題文がおかしい","データが古い","その他"];
let repKind = REP_KINDS[0];
let serverOK = true;

function localReports(){
  try { return JSON.parse(localStorage.getItem(REP_KEY) || "[]"); } catch(e){ return []; }
}
function saveLocal(list){
  try { localStorage.setItem(REP_KEY, JSON.stringify(list)); } catch(e){}
}
/* 報告は画面に出さず、送信だけする。端末内には未送信分の控えとして残す */
function updateDot(){}
function toast(msg){
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2200);
}

function openReport(){
  const q = state.quiz[state.idx];
  if(!q) return;
  repKind = REP_KINDS[0];
  const ov = document.createElement("div");
  ov.className = "overlay";
  ov.innerHTML = `
    <div class="modal">
      <h3>問題の報告</h3>
      <p class="sub">おかしいと思った点を教えてください。問題の内容は自動で記録されます。</p>
      <div class="qbox">
        <div><b>${esc(plain(q.text))}</b></div>
        <div style="margin-top:5px;">選択肢: ${esc(q.choices.join(" / "))}</div>
        <div>アプリの正解: <b>${esc(q.answer)}</b></div>
      </div>
      <label>どこがおかしい？</label>
      <div class="chips" id="repKinds"></div>
      <label style="margin-top:14px;">補足（正しい情報が分かれば書いてください）</label>
      <textarea id="repComment" placeholder="例: センターは○○ではなく△△が正しい"></textarea>
      <div class="acts">
        <button class="btn sub sm" id="repCancel">キャンセル</button>
        <button class="btn sm" id="repSend">報告する</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  const kc = ov.querySelector("#repKinds");
  REP_KINDS.forEach(k => {
    const b=document.createElement("button");
    b.className="chip sm"; b.textContent=k;
    b.setAttribute("aria-pressed", repKind===k);
    b.onclick=()=>{ repKind=k; [...kc.children].forEach(x=>x.setAttribute("aria-pressed", x===b)); };
    kc.appendChild(b);
  });
  ov.onclick = e => { if(e.target===ov) ov.remove(); };
  ov.querySelector("#repCancel").onclick = () => ov.remove();
  ov.querySelector("#repSend").onclick = () => {
    sendReport(q, repKind, ov.querySelector("#repComment").value.trim());
    ov.remove();
  };
}

function sendReport(q, kind, comment){
  const rec = {
    at: new Date().toISOString(),
    kind, comment,
    group: q.group, tag: q.tag, genId: q.genId, level: q.level || state.level,
    question: plain(q.text),
    choices: q.choices,
    answer: q.answer,
    src: q.src || null,
  };
  const list = localReports(); list.push(rec); saveLocal(list); updateDot();

  // ローカルサーバー経由なら reports.jsonl にも保存する
  // (file:// で直接開いた場合や、静的ホスティングに置いた場合は失敗するが、
  //  ブラウザ内には保存済みなので問題ない)
  fetch("report", {
    method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec)
  }).then(r => { serverOK = r.ok; }).catch(() => { serverOK = false; });

  const rl = $("qReport");
  rl.textContent = "報告しました（報告タブで確認できます）";
  rl.classList.add("done"); rl.disabled = true;
  toast("報告を受け付けました");
}
$("qReport").onclick = openReport;

/* 溜まった報告をまとめて取り出す。開発者用なので画面には出さず、
   ブラウザのコンソールで __reports() と打つと使える。 */
window.__reports = function(){
  const list = localReports();
  const text = list.map((r,i) =>
    `【${i+1}】${r.kind}\n問題: ${r.question}\n選択肢: ${r.choices.join(" / ")}\n` +
    `アプリの正解: ${r.answer}\nグループ: ${r.group}／種類: ${r.tag}（${r.genId}）\n` +
    (r.comment ? `補足: ${r.comment}\n` : "") +
    (r.src ? `元データ: ${JSON.stringify(r.src)}\n` : "") + `日時: ${r.at}`
  ).join("\n\n----------\n\n");
  console.log(text || "報告はありません");
  return list;
};

/* ================= 起動 ================= */
window.__QUIZ = { buildQuiz, buildContext, GENERATORS, solo, usable, notInvolved, colorSwatches };

renderSetup();
initModebars();
updateDot();
$("dataNote").innerHTML =
  `<div class="notice">` +
    `このサイトは<b>非公式</b>です。各グループおよび関係各社とは一切関係ありません。<br>` +
    `収録データは<b>AIが収集したもの</b>で、誤りが含まれる場合があります。` +
  `</div>` +
  `収録データ: 楽曲 ${D.songs.length}件 ／ メンバー ${D.members.length}名`;

/* オフラインでも遊べるようにする(https / localhost のときだけ有効) */
if("serviceWorker" in navigator && (location.protocol==="https:" || location.hostname==="localhost")){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
}

/* iPhoneのSafariで開いていて、まだホーム画面に追加していないときだけ案内を出す */
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

                 font-size:12.5px;line-height:1.7;text-align:left;">
       <b>ホーム画面に追加すると、アプリのように使えます</b><br>
       下の共有ボタン <b>⬆︎</b> →「ホーム画面に追加」
     </div>`);
}

})();
</script>
